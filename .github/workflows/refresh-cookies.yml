name: Refresh Cookies

on:
  schedule:
    - cron: "0 */12 * * *"  # Every 12 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-cookies
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          # GitHub runners break on dl.google.com/linux/chrome-stable (flaky,
          # "Hash Sum mismatch"). Install deps directly instead of --with-deps.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google.list 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libatspi2.0-0 xvfb || true
          for i in 1 2 3; do
            python3 -m playwright install chromium && break
            sleep 10
          done

      - name: Refresh cookies
        env:
          COOKIES_DIR: cookies
          HEADLESS: "0"
        run: xvfb-run -a python3 scripts/refresh_cookies.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet cookies/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No cookie changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Cookies were refreshed"
            git diff --stat cookies/
          fi

      - name: Commit refreshed cookies
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          skip_checkout: true
          file_pattern: cookies/*.txt
          commit_message: "Auto-refresh Hotstar cookies [skip ci]"

  rebuild:
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
