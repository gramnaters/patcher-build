name: Build Android TV

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-tv
  cancel-in-progress: false

env:
  PACKAGE_NAME: in.startv.hotstar
  ARCH: universal
  APP_VARIANT: tv

jobs:
  build:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_BYPASS_SOLVER_TRAWL_8191_ENABLED: "true"
      CF_BYPASS_SOLVER_CFB_ENABLED: "true"
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cloudflarebypassforscraping:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install apktool
        run: |
          APKTOOL_URL=$(curl -sL "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['assets'][0]['browser_download_url'])")
          curl -sL "$APKTOOL_URL" -o /usr/local/bin/apktool.jar
          echo '#!/bin/bash' > /usr/local/bin/apktool
          echo 'exec java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Resolve next TV version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date -u +"%y")
          TAG=$( { gh release list --exclude-drafts -L 100 2>/dev/null || true; } | \
            awk -F '\t' -v year="$YEAR" '$3 ~ "^tv" year "[0-9][0-9][0-9][0-9]$" {print $3}' | sort -nr | head -n1)
          if [ -n "$TAG" ]; then
            BUILD_COUNT=${TAG:4:4}
            BUILD_COUNT=$((10#$BUILD_COUNT + 1))
          else
            BUILD_COUNT=1
          fi
          NEXT_VER_CODE=$(printf "tv%s%04d" "$YEAR" "$BUILD_COUNT")
          echo "NEXT_VER_CODE=$NEXT_VER_CODE" >> "$GITHUB_OUTPUT"
          echo "Next TV version code: $NEXT_VER_CODE"

      - name: Validate cookie files
        run: |
          REQUIRED=(sessionUserUP.txt userHID.txt userPID.txt deviceId.txt)
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "cookies/$f" ]; then
              echo "::error::Missing cookie file: $f"
              exit 1
            fi
            echo "  $f: $(wc -c < cookies/$f) bytes"
          done

      - name: Install APKEditor (split table merger)
        run: |
          APKEDITOR_URL=$(curl -sL "https://api.github.com/repos/REAndroid/APKEditor/releases/latest" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['assets'][0]['browser_download_url'])")
          curl -sL "$APKEDITOR_URL" -o /usr/local/bin/apkeditor.jar
          # Note: APKEditor -v prints the version but exits with code 2
          java -jar /usr/local/bin/apkeditor.jar -v || true

      - name: Download APK (Android TV from APKMirror via CF bypass services)
        env:
          ARCH: ${{ env.ARCH }}
          APP_VARIANT: ${{ env.APP_VARIANT }}
          TRAWL_URL: http://localhost:8191/scrape
          CFBS_URL: http://localhost:8000
          APKEDITOR_JAR: /usr/local/bin/apkeditor.jar
        run: python3 scripts/download_apk.py

      - name: Read downloaded version
        id: apk_ver
        run: |
          VNAME=$(cat version.txt 2>/dev/null || echo "unknown")
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "Downloaded JioHotstar TV version: $VNAME"

      - name: Decompile APK
        id: decompile
        run: |
          apktool d jiohotstar.apk -o decompiled -f 2>&1
          if [ ! -f decompiled/AndroidManifest.xml ]; then
            echo "::error::Decompile failed"
            exit 1
          fi
          VCODE=$(grep -oP '^\s*versionCode:\s*\K[0-9]+' decompiled/apktool.yml 2>/dev/null | head -1) || true
          VNAME=$(grep -oP "^\s*versionName:\s*\K[^'\"\n]+" decompiled/apktool.yml 2>/dev/null | tr -d "'\"" | head -1) || true
          echo "apk_version_code=${VCODE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "apk_version_name=${VNAME:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Remove split APK flags & fix resources
        run: |
          MANIFEST="decompiled/AndroidManifest.xml"
          sed -i 's/ android:isSplitRequired="[^"]*"//g' "$MANIFEST"
          sed -i 's/ android:requiredSplitTypes="[^"]*"//g' "$MANIFEST"
          sed -i 's/ android:splitTypes="[^"]*"//g' "$MANIFEST"
          sed -i '/com.android.vending.splits.required/d' "$MANIFEST"
          sed -i '/android:name="com.android.vending.splits"/d' "$MANIFEST"
          sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/g' "$MANIFEST"
          sed -i 's/android:intentMatchingFlags="[^"]*" //g' "$MANIFEST"
          find decompiled/res/drawable* -name "*.xml" -exec \
            sed -i 's/android:drawable="@null"/android:drawable="@android:color\/transparent"/g' {} \; 2>/dev/null || true

      - name: Inject smali patches
        run: |
          SMALI_DIR=""
          SMALLEST=999999
          for dir in decompiled/smali*/; do
            COUNT=$(find "$dir" -name "*.smali" -type f 2>/dev/null | wc -l)
            if [ "$COUNT" -lt "$SMALLEST" ]; then SMALLEST=$COUNT; SMALI_DIR="$dir"; fi
          done
          [ -z "$SMALI_DIR" ] && SMALI_DIR="decompiled/smali/"
          TARGET="$SMALI_DIR/com/hotstar/patch"
          mkdir -p "$TARGET"
          cp patches/CookieFileReader.smali "$TARGET/"
          cp patches/cookie-seeder.smali "$TARGET/CookieSeeder.smali"
          mkdir -p decompiled/assets/cookies
          for f in cookies/*.txt; do [ -f "$f" ] && cp "$f" "decompiled/assets/cookies/$(basename "$f")"; done

      - name: Patch Application class
        run: |
          MANIFEST="decompiled/AndroidManifest.xml"
          APP_CLASS=$(grep -oP '<application[^>]*android:name="\K[^"]+' "$MANIFEST")
          SMALI_PATH="${APP_CLASS//./\/}.smali"
          FULL_PATH=""
          for dir in decompiled/smali*/; do
            if [ -f "${dir}${SMALI_PATH}" ]; then FULL_PATH="${dir}${SMALI_PATH}"; break; fi
          done
          if [ -z "$FULL_PATH" ]; then
            CLASS_NAME=$(echo "$APP_CLASS" | sed 's/.*\.//')
            FULL_PATH=$(find decompiled -path "*/smali*" -name "${CLASS_NAME}.smali" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$FULL_PATH" ]; then echo "::error::Application class not found"; exit 1; fi
          if grep -q "CookieSeeder" "$FULL_PATH"; then exit 0; fi
          INJECT='    invoke-static {p0}, Lcom/hotstar/patch/CookieSeeder;->seedIfNeeded(Landroid/content/Context;)V'
          LINE_NUM=$(grep -n "invoke-super" "$FULL_PATH" | head -1 | cut -d: -f1)
          sed -i "${LINE_NUM}a\\${INJECT}" "$FULL_PATH"

      - name: Patch UserPreferences (auth token injection)
        run: |
          python3 scripts/patch_userprefs.py decompiled

      - name: Recompile APK
        run: |
          set +e
          apktool b decompiled -o jiohotstar_tv_unsigned.apk 2>&1 | tail -10
          set -e
          if [ ! -f jiohotstar_tv_unsigned.apk ]; then
            echo "::error::Recompile failed"
            exit 1
          fi
          echo "Recompiled: $(ls -la jiohotstar_tv_unsigned.apk | awk '{print $5}') bytes"

      - name: Restore original resources (fix Resources$NotFoundException)
        run: |
          echo "Replacing recompiled resources with originals..."
          mkdir -p orig_res
          unzip -o jiohotstar.apk "resources.arsc" "res/*" -d orig_res 2>/dev/null
          zip -d jiohotstar_tv_unsigned.apk "resources.arsc" "res/*" 2>/dev/null || true
          (cd orig_res && zip -0 -r ../jiohotstar_tv_unsigned.apk resources.arsc res/ 2>/dev/null)
          rm -rf orig_res
          echo "Resources restored: $(unzip -l jiohotstar_tv_unsigned.apk | grep -c 'res/') res entries"

      - name: Inject native libs & sign APK (always signed)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          export PATH="${BUILD_TOOLS}:${PATH}"

          # 1) Ensure lib/ native libs are present in the recompiled APK
          cp jiohotstar_tv_unsigned.apk jiohotstar_tv_mod.apk
          LIB_COUNT=$(unzip -l jiohotstar_tv_mod.apk 2>/dev/null | grep -c "lib/.*\.so" || true)
          echo "Native libs in recompiled APK: $LIB_COUNT"
          if [ "$LIB_COUNT" -eq 0 ]; then
            LIB_SRC=""
            if [ -f arm64_split.apk ] && [ "$(stat -c%s arm64_split.apk 2>/dev/null || echo 0)" -gt 1000000 ]; then
              LIB_SRC="arm64_split.apk"
            else
              LIB_SRC="jiohotstar.apk"
            fi
            echo "Injecting lib/* from $LIB_SRC"
            mkdir -p lib_tmp && unzip -o "$LIB_SRC" "lib/*" -d lib_tmp 2>/dev/null || true
            if find lib_tmp -name "*.so" 2>/dev/null | grep -q .; then
              zip -d jiohotstar_tv_mod.apk "META-INF/*" 2>/dev/null || true
              (cd lib_tmp && zip -r ../jiohotstar_tv_mod.apk lib/ 2>/dev/null)
              zip -d jiohotstar_tv_mod.apk "META-INF/*" 2>/dev/null || true
            else
              echo "::warning::No lib/*.so found in $LIB_SRC — keeping APK as-is"
            fi
            rm -rf lib_tmp
          fi
          echo "Post-inject lib count: $(unzip -l jiohotstar_tv_mod.apk 2>/dev/null | grep -c 'lib/.*\.so' || true)"

          # 2) Always sign with the stable committed keystore
          zipalign -f 4 jiohotstar_tv_mod.apk jiohotstar_tv_aligned.apk
          apksigner sign --ks signing/hotstar.keystore --ks-pass pass:hotstarpatch --ks-key-alias hotstar --key-pass pass:hotstarpatch --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out jiohotstar_tv_patched.apk jiohotstar_tv_aligned.apk
          rm -f jiohotstar_tv_aligned.apk jiohotstar_tv_mod.apk

          # 3) Verify — fail the build if the APK is not properly signed
          apksigner verify --verbose --print-certs jiohotstar_tv_patched.apk
          echo "APK_SIGNED=1" >> "$GITHUB_ENV"

      - name: Rename final APK
        run: |
          VNAME="${{ steps.apk_ver.outputs.version_name }}"
          FINAL_NAME="JioHotstar-TV-v${VNAME}-universal.apk"
          mkdir -p build
          cp jiohotstar_tv_patched.apk "build/$FINAL_NAME"
          echo "FINAL_NAME=$FINAL_NAME" >> "$GITHUB_ENV"
          echo "Final APK: $FINAL_NAME ($(du -h "build/$FINAL_NAME" | cut -f1))"

      - name: Generate build.md (release notes)
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          APK_VERSION: ${{ steps.apk_ver.outputs.version_name }}
          APK_VERSION_CODE: ${{ steps.decompile.outputs.apk_version_code }}
          FINAL_NAME: ${{ env.FINAL_NAME }}
          ARCH: ${{ env.ARCH }}
          APP_VARIANT: tv
        run: |
          python3 scripts/generate_release_notes.py > build.md
          echo "Generated build.md ($(wc -l < build.md) lines)"

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.get_output.outputs.BUILD_LOG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./build/*
          name: TV Build No. ${{ steps.version.outputs.NEXT_VER_CODE }}
          tag_name: ${{ steps.version.outputs.NEXT_VER_CODE }}
          overwrite_files: true
          prerelease: false

  trigger_cleanup:
    permissions:
      contents: write
      actions: write
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

